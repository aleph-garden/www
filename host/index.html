<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Before anything paints, so a stored light or dark choice holds from
         the first frame. -->
    <script src="/theme-boot.js"></script>
    <title>Aleph Garden</title>
    <meta
      name="description"
      content="Christopher Mühl's lab for personal data: mail, photos, places and notes in one graph he owns, and the projects that get data in, keep it, describe it and draw it."
    />

    <!-- The mark at the sizes each surface asks for. favicon.svg is the
         16px composition, one ink on the dark ground, so the leaf survives
         in a tab. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- The two faces the page sets above the fold, from the URL every page on
         aleph.garden shares, fetched before the stylesheet asks. -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="https://aleph.garden/fonts/ibm-plex-sans-latin.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="https://aleph.garden/fonts/sora-semibold-latin.woff2" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fcfaf6" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f1213" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Aleph Garden" />
    <meta property="og:title" content="Aleph Garden" />
    <meta
      property="og:description"
      content="A lab for personal data: mail, photos, places and notes in one graph I own, and the projects that get data in, keep it, describe it and draw it."
    />
    <meta property="og:url" content="https://aleph.garden/" />
    <meta property="og:image" content="https://aleph.garden/social-card.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <script type="module" src="./src/entry.ts"></script>
  </head>
  <!-- No theme class: this host follows the reader's colour scheme, which is
       tier 3 of the token system's resolution order. The pod host pins dark,
       because a vault's own snippets are written against one appearance. -->
  <body>
    <main id="root"></main>
  </body>
</html>
